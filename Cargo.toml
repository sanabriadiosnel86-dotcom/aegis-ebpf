[workspace]
resolver = "3"
members = [
    "crates/aegis-probe",
    "crates/aegis-probe-common",
    "crates/aegis-probe-ebpf",
]
# The eBPF crate only builds for the BPF target; aegis-probe compiles it
# through its build script.
default-members = ["crates/aegis-probe", "crates/aegis-probe-common"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sanabriadiosnel86-dotcom/aegis-ebpf"
publish = false

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }

anyhow = { version = "1.0.104", default-features = false }
cargo_metadata = { version = "0.23.1", default-features = false }
# `std` is currently required to build clap.
clap = { version = "4.6.7", default-features = false, features = ["std"] }
env_logger = { version = "0.11.11", default-features = false }
humantime = { version = "2.4.0", default-features = false }
libc = { version = "0.2.189", default-features = false }
log = { version = "0.4.34", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
tokio = { version = "1.53.1", default-features = false }
which = { version = "8.0.6", default-features = false }

[profile.release]
lto = "thin"

[profile.release.package.aegis-probe-ebpf]
debug = 2
codegen-units = 1

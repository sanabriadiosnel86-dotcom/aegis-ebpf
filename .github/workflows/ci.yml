name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to match the Dockerfile, for reproducible builds.
  RUST_NIGHTLY: nightly-2026-09-23
  BPF_LINKER_VERSION: 0.11.1

jobs:
  go:
    name: Go (agent, fixer, events)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -v ./...

  rust:
    name: Rust & eBPF (probe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The eBPF crate is compiled by a build script through this nightly
      # toolchain (see crates/aegis-probe/build.rs); it needs rust-src to
      # build core for the BPF target.
      - name: Install the nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: rust-src
      # Stable builds and tests the user-space code; it is the default.
      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # bpf-linker links the eBPF programs; its release binaries bundle LLVM.
      - name: Install bpf-linker
        uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker@${{ env.BPF_LINKER_VERSION }}
      # The default members are the user-space crates; the eBPF crate is not
      # checked for the host, since a build script cross-compiles it for the
      # BPF target instead.
      - name: cargo check
        run: cargo check --all-targets
        env:
          AEGIS_EBPF_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
      - name: cargo test
        run: cargo test
        env:
          AEGIS_EBPF_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}

  web:
    name: Web (dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run build
        run: npm run build

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Redocly lint
        run: npx @redocly/cli@2.54.2 lint openapi.yaml
